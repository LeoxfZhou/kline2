spring.application.name=kline2

# Database credentials must be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

binance.url_template=https://www.binance.com/api/v3/klines?symbol=%s&interval=1m&startTime=%s&endTime=%s&limit=%s
binance.url.limit=500
binance.url.combined_num=5

# Redis credentials must be supplied through environment variables when required.
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
